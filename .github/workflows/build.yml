name: Build and publish source

on:
  push:
    branches:
      - main
      - master
    paths:
      - "sources/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "sources/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            sources/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('sources/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Aidoku CLI if needed
        run: |
          if ! command -v aidoku >/dev/null 2>&1; then
            cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli
          fi

      - name: Check formatting
        run: |
          set -e
          for src in sources/*; do
            (cd "$src" && cargo fmt --all --check)
          done

      - name: Run Clippy
        run: |
          set -e
          for src in sources/*; do
            (cd "$src" && cargo clippy -- -D warnings)
          done

      - name: Package sources
        run: |
          set -e
          mkdir -p release
          for src in sources/*; do
            (cd "$src" && aidoku package)
            name="${src##*/}"
            mv "$src/package.aix" "release/$name.aix"
          done

      - name: Build source list
        run: aidoku build release/*.aix --name "Aidoku Gallery" --output public

      - name: Verify source list
        run: |
          test -s public/index.json
          test -s public/index.min.json
          jq -e '.sources | length > 0' public/index.min.json >/dev/null

      - name: Disable Jekyll
        run: touch public/.nojekyll

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: buondua-aidoku-source
          path: release/*.aix
          if-no-files-found: error

      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list

      - name: Verify gh-pages source list
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:index.min.json | jq -e '.sources | length > 0' >/dev/null
